<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nullstacks Temp Mail</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo"><em>nullstacks</em> temp mail</span>
      <span class="tag">temp.tf</span>
    </div>
    <span id="sync" title="Force inbox refresh">⟳ refresh</span>
  </header>

  <!-- ===== email card ===== -->
  <section class="addr-card">
    <div class="addr-row">
      <div id="email" class="empty">no address yet — press New</div>
      <button id="copy" class="iconbtn" title="Copy address" disabled>⧉</button>
    </div>
    <div class="btnrow">
      <button id="new" class="btn primary">✦ New</button>
      <button id="fill" class="btn" title="Fill the focused email field on the current page">⤓ Fill on page</button>
      <button id="change" class="btn danger" title="Discard this address and generate a new one">↻ Change</button>
      <button id="customToggle" class="btn" title="Use any custom address instead">✎ Custom</button>
    </div>
    <div class="opts">
      <select id="mode" title="Generator mode">
        <option value="random+plus">Random + plus alias</option>
        <option value="dot">Gmail dot alias</option>
        <option value="plus">Plus alias</option>
        <option value="dot+plus">Dot + plus</option>
      </select>
      <select id="prov" title="Provider">
        <option value="any">Any provider</option>
        <option value="gmail">gmail.com</option>
        <option value="outlook">outlook.com</option>
        <option value="hotmail">hotmail.com</option>
      </select>
    </div>
    <div id="customRow">
      <input id="customEmail" type="email" placeholder="type any address, then press Set" />
      <button id="customSet" class="btn">Set</button>
    </div>
  </section>

  <div id="status"></div>

  <!-- ===== inbox ===== -->
  <section id="inboxPane">
    <div class="inbox-head">
      <span id="inboxTitle">Inbox</span>
      <span id="pollInfo"></span>
    </div>
    <div id="list">
      <div class="empty-state" id="emptyState">No mail yet.<br /><b>Give the address a minute</b> — new mail appears automatically.</div>
    </div>
  </section>

  <!-- ===== single message view ===== -->
  <section id="msgView">
    <div class="mv-head">
      <div class="mv-subject" id="mvSubject"></div>
      <div class="mv-meta" id="mvMeta"></div>
      <div class="mv-actions">
        <button id="mvBack">← Inbox</button>
        <button id="mvCopyBody">⧉ Copy body text</button>
        <button id="mvCopyOtp" style="display:none">⧉ Copy code</button>
      </div>
    </div>
    <div id="msgBody"></div>
  </section>

  <!-- ===== history panel ===== -->
  <section id="history" style="display:none"></section>

  <script src="popup.js"></script>
</body>
</html>
